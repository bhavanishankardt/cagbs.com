document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

12px;font-family:'Geist Mono',monospace;letter-spacing:0.12em;text-transform:uppercase;color:#2563eb\">Practice Areas<\u002Fdiv>\n      <h2 style=\"margin:0;font-family:'Geist',sans-serif;font-weight:400;font-size:clamp(40px,5.5vw,68px);line-height:1;letter-spacing:-0.035em\">Five practice areas.<br><em style=\"font-style:normal;color:#5b6478\">One standard.<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:17px;line-height:1.6;color:#3b4458;max-width:480px;text-wrap:pretty\">From routine compliance to contested litigation, the practice covers taxation, audit and accounting for individuals, businesses and early-stage companies.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"border-top:1px solid #0b1020\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px 64px;padding:clamp(28px,4vw,44px) 0;border-bottom:1px solid #dde3ec\">\n      <div style=\"display:flex;gap:20px;align-items:baseline\">\n        <span style=\"font-family:'Geist Mono',monospace;font-size:14px;color:#2563eb\">01<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <h3 style=\"margin:0;font-family:'Geist',sans-serif;font-weight:500;letter-spacing:-0.02em;font-size:clamp(26px,3vw,34px);line-height:1.05\">Direct Tax<\u002Fh3>\n          <span style=\"font-size:13px;color:#5b6478\">income-tax · corporate · international<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px 32px;font-size:15px;line-height:1.5;color:#1e2638\">\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Income-tax return filing &amp; year-round compliance<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Tax planning &amp; advisory for individuals and businesses<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Assessments, scrutiny &amp; representation before authorities<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Appeals &amp; litigation support up to appellate tribunals<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">TDS compliance and DTAA / cross-border matters<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px 64px;padding:clamp(28px,4vw,44px) 0;border-bottom:1px solid #dde3ec\">\n      <div style=\"display:flex;gap:20px;align-items:baseline\">\n        <span style=\"font-family:'Geist Mono',monospace;font-size:14px;color:#2563eb\">02<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <h3 style=\"margin:0;font-family:'Geist',sans-serif;font-weight:500;letter-spacing:-0.02em;font-size:clamp(26px,3vw,34px);line-height:1.05\">Indirect Tax<\u002Fh3>\n          <span style=\"font-size:13px;color:#5b6478\">gst · customs · foreign trade policy<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px 32px;font-size:15px;line-height:1.5;color:#1e2638\">\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">GST registration, returns &amp; annual filings<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Refunds — exports &amp; inverted duty structure<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Show-cause notice replies &amp; departmental representation<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">GST audits, reconciliations &amp; advisory on classification<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Customs — classification, valuation, duty drawback &amp; import/export compliance<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Appellate &amp; tribunal litigation, including GSTAT and CESTAT matters<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px 64px;padding:clamp(28px,4vw,44px) 0;border-bottom:1px solid #dde3ec\">\n      <div style=\"display:flex;gap:20px;align-items:baseline\">\n        <span style=\"font-family:'Geist Mono',monospace;font-size:14px;color:#2563eb\">03<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <h3 style=\"margin:0;font-family:'Geist',sans-serif;font-weight:500;letter-spacing:-0.02em;font-size:clamp(26px,3vw,34px);line-height:1.05\">Audit &amp; Assurance<\u002Fh3>\n          <span style=\"font-size:13px;color:#5b6478\">statutory · tax · internal<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px 32px;font-size:15px;line-height:1.5;color:#1e2638\">\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Statutory audits of companies and firms<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Tax audits under the Income-tax Act<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Internal, stock &amp; concurrent audits<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Certifications for banks, authorities &amp; regulators<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px 64px;padding:clamp(28px,4vw,44px) 0;border-bottom:1px solid #dde3ec\">\n      <div style=\"display:flex;gap:20px;align-items:baseline\">\n        <span style=\"font-family:'Geist Mono',monospace;font-size:14px;color:#2563eb\">04<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <h3 style=\"margin:0;font-family:'Geist',sans-serif;font-weight:500;letter-spacing:-0.02em;font-size:clamp(26px,3vw,34px);line-height:1.05\">Corporate Accounting<\u002Fh3>\n          <span style=\"font-size:13px;color:#5b6478\">books · financial statements · reporting<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px 32px;font-size:15px;line-height:1.5;color:#1e2638\">\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Bookkeeping &amp; monthly accounting<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Preparation of financial statements<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">MIS reporting &amp; reconciliations<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Payroll &amp; statutory deductions<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px 64px;padding:clamp(28px,4vw,44px) 0;border-bottom:1px solid #dde3ec\">\n      <div style=\"display:flex;gap:20px;align-items:baseline\">\n        <span style=\"font-family:'Geist Mono',monospace;font-size:14px;color:#2563eb\">05<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <h3 style=\"margin:0;font-family:'Geist',sans-serif;font-weight:500;letter-spacing:-0.02em;font-size:clamp(26px,3vw,34px);line-height:1.05\">Startup Support<\u002Fh3>\n          <span style=\"font-size:13px;color:#5b6478\">set-up · registrations · compliance<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px 32px;font-size:15px;line-height:1.5;color:#1e2638\">\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Choice of entity &amp; incorporation<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">PAN, TAN, GST &amp; DPIIT Startup India registrations<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Accounting and compliance set-up from day one<\u002Fli>\n        <li style=\"padding-left:18px;border-left:1px solid #dde3ec\">Financials and documentation for investors and lenders<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"approach\" data-screen-label=\"Approach\" style=\"background:#eef2f8\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:clamp(64px,9vw,120px) clamp(20px,4vw,48px)\">\n    <div style=\"display:flex;flex-direction:column;gap:16px;margin-bottom:clamp(40px,6vw,64px)\">\n      <div style=\"font-size:12px;font-family:'Geist Mono',monospace;letter-spacing:0.12em;text-transform:uppercase;color:#2563eb\">Approach<\u002Fdiv>\n      <h2 style=\"margin:0;font-family:'Geist',sans-serif;font-weight:400;font-size:clamp(40px,5.5vw,68px);line-height:1;letter-spacing:-0.035em\">How the work is done.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:32px 40px\">\n      <div style=\"display:flex;flex-direction:column;gap:14px;background:#ffffff;border:1px solid #dde3ec;border-radius:14px;padding:28px;transition:border-color .2s,transform .2s\" style-hover=\"border-color:#2563eb;transform:translateY(-3px)\">\n        <h4 style=\"margin:0;font-family:'Geist',sans-serif;font-weight:600;font-size:24px;letter-spacing:-0.02em\">Precision<\u002Fh4>\n        <p style=\"margin:0;font-size:16px;line-height:1.6;color:#3b4458;text-wrap:pretty\">Every position is grounded in the statute, the rules, and the latest jurisprudence — reconciled to the figure, not the estimate.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px;background:#ffffff;border:1px solid #dde3ec;border-radius:14px;padding:28px;transition:border-color .2s,transform .2s\" style-hover=\"border-color:#2563eb;transform:translateY(-3px)\">\n        <h4 style=\"margin:0;font-family:'Geist',sans-serif;font-weight:600;font-size:24px;letter-spacing:-0.02em\">Representation<\u002Fh4>\n        <p style=\"margin:0;font-size:16px;line-height:1.6;color:#3b4458;text-wrap:pretty\">From scrutiny to the appellate tribunal, your matter is argued on its merits — drafted, defended, and seen through to a decision.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px;background:#ffffff;border:1px solid #dde3ec;border-radius:14px;padding:28px;transition:border-color .2s,transform .2s\" style-hover=\"border-color:#2563eb;transform:translateY(-3px)\">\n        <h4 style=\"margin:0;font-family:'Geist',sans-serif;font-weight:600;font-size:24px;letter-spacing:-0.02em\">Clarity<\u002Fh4>\n        <p style=\"margin:0;font-size:16px;line-height:1.6;color:#3b4458;text-wrap:pretty\">Complex tax outcomes explained in plain terms, so you always understand where you stand and what comes next.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"about\" data-screen-label=\"About\" style=\"max-width:1240px;margin:0 auto;padding:clamp(64px,9vw,120px) clamp(20px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:48px 80px\">\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"font-size:12px;font-family:'Geist Mono',monospace;letter-spacing:0.12em;text-transform:uppercase;color:#2563eb\">About<\u002Fdiv>\n    <h2 style=\"margin:0;font-family:'Geist',sans-serif;font-weight:400;font-size:clamp(40px,5.5vw,68px);line-height:1;letter-spacing:-0.035em\">A focused, <em style=\"font-style:normal;color:#5b6478\">independent<\u002Fem> practice.<\u002Fh2>\n    <dl style=\"margin:32px 0 0;display:grid;grid-template-columns:auto 1fr;gap:0;font-size:15px;border-top:1px solid #dde3ec\">\n      <dt style=\"padding:14px 24px 14px 0;color:#5b6478;border-bottom:1px solid #dde3ec\">Designation<\u002Fdt><dd style=\"margin:0;padding:14px 0;border-bottom:1px solid #dde3ec\">Chartered Accountant<\u002Fdd>\n      <dt style=\"padding:14px 24px 14px 0;color:#5b6478;border-bottom:1px solid #dde3ec\">ICAI Membership<\u002Fdt><dd style=\"margin:0;padding:14px 0;border-bottom:1px solid #dde3ec\">290100<\u002Fdd>\n      <dt style=\"padding:14px 24px 14px 0;color:#5b6478;border-bottom:1px solid #dde3ec\">Base<\u002Fdt><dd style=\"margin:0;padding:14px 0;border-bottom:1px solid #dde3ec\">Proddatur · Remote across India<\u002Fdd>\n      <dt style=\"padding:14px 24px 14px 0;color:#5b6478;border-bottom:1px solid #dde3ec\">Focus<\u002Fdt><dd style=\"margin:0;padding:14px 0;border-bottom:1px solid #dde3ec\">Taxation, Audit &amp; Accounting<\u002Fdd>\n    <\u002Fdl>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:22px;font-size:17px;line-height:1.7;color:#1e2638;max-width:620px\">\n    <p style=\"margin:0;font-family:'Geist',sans-serif;font-size:clamp(22px,2.2vw,26px);line-height:1.45;color:#0b1020;text-wrap:pretty\">Bhavani Shankar Giddaluru is a <strong style=\"font-weight:500\">Qualified Chartered Accountant<\u002Fstrong> in practice, with a dedicated focus on the taxation of businesses and individuals across both direct and indirect tax.<\u002Fp>\n    <p style=\"margin:0;text-wrap:pretty\">The practice spans hands-on advisory and litigation — GST refunds and show-cause notices, income-tax assessments and appeals — alongside the recurring work that keeps clients compliant: <strong style=\"font-weight:600\">return filings<\u002Fstrong> across income-tax and GST, <strong style=\"font-weight:600\">tax audits<\u002Fstrong> and statutory audit support, and day-to-day reconciliations. Every engagement is dealt with diligence, technical depth, and attention to detail. The objective is to deliver clear, practical, and defensible tax outcomes.<\u002Fp>\n    <p style=\"margin:0;text-wrap:pretty\">Based in <strong style=\"font-weight:600\">Proddatur, Andhra Pradesh<\u002Fstrong>, with services provided remotely to clients across India.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" data-screen-label=\"Contact\" style=\"background:#0b1020;color:#f1f5f9;border-bottom:1px solid #1e293b\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:clamp(64px,9vw,120px) clamp(20px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px 80px;align-items:end\">\n    <div style=\"display:flex;flex-direction:column;gap:22px\">\n      <h2 style=\"margin:0;font-family:'Geist',sans-serif;font-weight:500;font-size:clamp(44px,6.5vw,84px);line-height:0.98;letter-spacing:-0.035em\">Let's talk about your <em style=\"font-style:normal;color:#22d3ee\">tax position.<\u002Fem><\u002Fh2>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;max-width:480px;text-wrap:pretty\">Whether it's a notice on your desk, a refund to pursue, or planning for the year ahead — start the conversation.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;border-top:1px solid #f1f5f9\">\n      <a href=\"mailto:bhavanishankar@cagbs.com\" style=\"color:#f1f5f9;display:flex;justify-content:space-between;gap:16px;padding:20px 0;border-bottom:1px solid rgba(148,163,184,0.3);flex-wrap:wrap\" style-hover=\"color:#22d3ee\">\n        <span style=\"font-size:12px;font-family:'Geist Mono',monospace;letter-spacing:0.1em;text-transform:uppercase\">Email<\u002Fspan>\n        <span style=\"font-family:'Geist',sans-serif;font-size:clamp(20px,2.2vw,26px)\">bhavanishankar@cagbs.com<\u002Fspan>\n      <\u002Fa>\n      <a href=\"tel:+919966418609\" style=\"color:#f1f5f9;display:flex;justify-content:space-between;gap:16px;padding:20px 0;border-bottom:1px solid rgba(148,163,184,0.3);flex-wrap:wrap\" style-hover=\"color:#22d3ee\">\n        <span style=\"font-size:12px;font-family:'Geist Mono',monospace;letter-spacing:0.1em;text-transform:uppercase\">Phone<\u002Fspan>\n        <span style=\"font-family:'Geist',sans-serif;font-size:clamp(20px,2.2vw,26px)\">+91 99664 18609<\u002Fspan>\n      <\u002Fa>\n      <a href=\"https://maps.google.com/?q=Proddatur,Kadapa,Andhra+Pradesh\" style=\"color:#f1f5f9;display:flex;justify-content:space-between;gap:16px;padding:20px 0;border-bottom:1px solid rgba(148,163,184,0.3);flex-wrap:wrap\" style-hover=\"color:#22d3ee\">\n        <span style=\"font-size:12px;font-family:'Geist Mono',monospace;letter-spacing:0.1em;text-transform:uppercase\">Office<\u002Fspan>\n        <span style=\"font-size:15px;line-height:1.5;text-align:right;max-width:320px\">5/42, Vijayanagaram Street, Proddatur, Kadapa District — 516360, Andhra Pradesh<br>Remote services across India<\u002Fspan>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background:#060a16;color:#94a3b8\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:56px clamp(20px,4vw,48px) 40px;display:flex;flex-direction:column;gap:36px\">\n    <div style=\"display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap;align-items:flex-end\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-family:'Geist',sans-serif;font-size:28px;color:#f7f9fc\">Bhavani Shankar Giddaluru.<\u002Fspan>\n        <span style=\"font-size:14px\">Chartered Accountant · M. No. 290100 · Proddatur, Andhra Pradesh<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-family:'Geist',sans-serif;font-size:17px;max-width:380px;line-height:1.5\">Focused practice in taxation, audit and accounting — advisory, compliance, and representation.<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:12px;line-height:1.7;color:#64748b;border-top:1px solid #1e293b;padding-top:24px;max-width:900px\">© Bhavani Shankar Giddaluru, Chartered Accountant. This website is for general information about the practice and does not constitute professional advice or solicitation. Displayed in conformity with the guidelines of the Institute of Chartered Accountants of India (ICAI).<\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showPhoto&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) return;\n    const els = document.querySelectorAll('section h1, section h2, section h3, section h4, section p, section li, section figure, section dl, section a[href^=\"mailto\"], section a[href^=\"tel\"], section a[href^=\"https://maps\"]');\n    this.io = new IntersectionObserver(entries => entries.forEach(e => {\n      if (!e.isIntersecting) return;\n      const el = e.target; el.style.opacity = '1'; el.style.transform = 'none'; this.io.unobserve(el);\n    }), { rootMargin: '0px 0px -8% 0px' });\n    els.forEach((el, i) => {\n      el.style.opacity = '0'; el.style.transform = 'translateY(18px)';\n      el.style.transition = 'opacity .7s cubic-bezier(.2,.7,.2,1) ' + ((i % 4) * 60) + 'ms, transform .7s cubic-bezier(.2,.7,.2,1) ' + ((i % 4) * 60) + 'ms';\n      this.io.observe(el);\n    });\n  }\n  componentWillUnmount() { this.io && this.io.disconnect(); }\n  renderVals() { return { showPhoto: this.props.showPhoto ?? true }; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
